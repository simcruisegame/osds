[/Script/EngineSettings.GameMapsSettings]
; An empty map: the drive builds the real place around the car at run time.
GameDefaultMap=/Engine/Maps/Entry
GameInstanceClass=/Script/OSDS.OsdsGameInstance
GlobalDefaultGameMode=/Script/OSDS.OsdsGameMode

[/Script/Engine.RendererSettings]
; Light, sky and rendering (docs/unreal-architecture.md). Everything is dynamic: the sun
; follows the real clock, so there is no baked lighting at all.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; Car paint: metallic flakes perturb the base coat under a smooth clear coat (Presentation/).
r.ClearCoatNormal=True
; Lumen for global illumination and reflections, traced against mesh distance fields
; (software Lumen; the RTX 2070 Max-Q gains little from hardware tracing at its cost).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
; r.Lumen.HardwareRayTracing is set by the graphics preset at run time (a project setting here would outrank it).
; Ray tracing support (2.1.1): the High and Ultra presets switch Lumen to hardware ray tracing at
; run time (OsdsGraphics.cpp), because the meshes the game builds at run time get no
; distance fields outside the editor. GPUs without it keep software Lumen.
r.RayTracing=True
r.SkinCache.CompileShaders=True
; The world's tiles are built at run time and stay resident in ray tracing (about 120 MB for the
; tiles around the car). The engine's development builds print a red warning over 20 % of the
; 400 MB pool; the pool is raised to 800 MB (the laptop GPU has 8 GB) and the warning to 50 %.
r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=800
r.RayTracing.Debug.GeometryMemoryPool.AlwaysResidentWarningPercentage=50
; Temporal Super Resolution: every preset renders below output resolution and upscales.
r.AntiAliasingMethod=4
; Physically based sky and clouds; height fog takes the atmosphere's colour.
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
; Physical camera: auto exposure in EV100 (histogram), so the sun can be 128 klx and the
; moon 0.3 lx. The environment narrows the band around the scene's reference EV.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Bias=1.0
; Local exposure compresses the tropical sun's highlights the way a phone camera's HDR does
; (the sky stays blue), and lifts the shadows as those cameras do (0.7: the realism score's mean over
; Ocean Drive, the Dragon and Big Sur went 37.1 -> 40.3, the Dragon's forest no longer near black;
; 0.95 kept shadows about 1.5-2 EV darker than the reference photos, the owner's "darks really dark").
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.55
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.7
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.LensFlare=False
; Screen percentage is set per preset (FOsdsGraphics); keep it out of display-based modes.
r.ScreenPercentage.Default=67
r.ScreenPercentage.Default.Desktop.Mode=0

[SystemSettings]
; TSR keeps the history of sub-pixel lines (window frames, rails, wires, poles) instead of
; rejecting it, so they stop flickering as the car moves (Epic, "Thin Geometry Detection with
; TSR"; lighting research 2026-11-12). Not a scalability cvar, so it lives here.
r.TSR.ThinGeometryDetection=1
; Lumen's cached lighting and the real-time sky capture are stored pre-exposed in
; 16-bit floats. The engine default (4) covers EV100 -8..12, but the real sun puts a
; tropical noon at EV 14-15 and the scene was clipped (an on-screen warning at 13.6).
; 7.5 covers EV100 -4.5..15.5: full sun down to the moonlit street (about -4).
r.EyeAdaptation.CachedLightingPreExposure=7.5
; The streamed tiles are large runtime meshes (not Nanite), which overflow the virtual
; shadow map's non-Nanite marking queue on wide views. The cost is known (see the
; architecture notes); the on-screen banner is not for players.
r.Shadow.Virtual.AllowScreenOverflowMessages=0

